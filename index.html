  <style>

      background: linear-gradient(135deg, #EBF5FB 0%, #E8F8F5 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    /* プニプニ立体ボタンの共通スタイル */
    .btn-bubbly {
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-bubbly:active {
      transform: translateY(4px);
    }
    /* ふわっとフェードイン */
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-height-screen text-slate-800 pb-12">

      { id: 59, stage: "⑥固定資産・経費等", question: "給料8,000,000円を支払うにあたり、従業員負担の所得税600,000円、社会保険料500,000円を控除し残額を当座預金から支払った", answer: "(借) 給料 8,000,000 ／ (貸) 当座預金 6,900,000・所得税預り金 600,000・社会保険料預り金 500,000" },
      { id: 60, stage: "⑥固定資産・経費等", question: "翌月, 上記の所得税預り金・社会保険料預り金に加えて、会社負担分の社会保険料560,000円を合わせて小切手で納付した", answer: "(借) 所得税預り金 600,000・社会保険料預り金 500,000・法定福利費 560,000 ／ (貸) 当座預金 1,660,000" },
      { id: 61, stage: "⑥固定資産・経費等", question: "出張で交通系ICカードを使用し電車代5,000円を支払った（なお、ICカードチャージ時に「仮払金」で処理していた）", answer: "(借) 旅費交通費 5,000 ／ (貸) 仮払金 5,000" },
      { id: 62, stage: "⑥固定資産・経費等", question: "事務所の新規賃貸に伴い、当月分家賃100,000円、不動産会社への仲介手数料200,000円、敷金300,000円を小切手で支払った", answer: "(借) 支払家賃 100,000・支払手数料 200,000・差入保証金 300,000 ／ (貸) 当座預金 600,000" },

      // 簿記3級⑦純資産
      { id: 63, stage: "⑦純資産", question: "株式会社は『①』を発行する。それを買い取った者は『②』という法的立場を獲得する", answer: "① 株式　② 株主", hint: "なお、実物としての「株券」は現代では原則として発行されません。" },
      { id: 64, stage: "⑦純資産", question: "会社設立にあたり、株式10,000株を1株1,000円で発行し、全額当座預金口座に払い込まれた", answer: "当座預金 10,000,000 ／ 資本金 10,000,000" },
      { id: 65, stage: "⑦純資産", question: "設立8年後、事業拡大(増資)のため株式10,000株を1株1,000円で追加発行し、全額当座預金に払い込まれた", answer: "当座預金 10,000,000 ／ 資本金 10,000,000" },
      { id: 66, stage: "⑦純資産", question: "株主総会の決議に基づき、繰越利益剰余金1,000,000円を利益準備金に積み立てた", answer: "繰越利益剰余金 1,000,000 ／ 利益準備金 1,000,000" },
      { id: 67, stage: "⑦純資産", question: "決算。収益（売上1,000・受取手数料100）、費用（給料800・支払利息200）を「損益」勘定へ振り替える仕訳をそれぞれ行え", answer: "① 売上 1,000・受取手数料 100 ／ 損益 1,100\n② 損益 1,000 ／ 給料 800・支払利息 200" },
      { id: 68, stage: "⑦純資産", question: "前問の結果、確定した当期純利益（損益勘定の残高100）を「繰越利益剰余金」へ振り替える仕訳を行え", answer: "損益 100 ／ 繰越利益剰余金 100" },
      { id: 69, stage: "⑦純資産", question: "横浜商店は個人商店である。この商店に代表取締役社長は存在するか？", answer: "存在しない（個人商店には会社法が適用されないためオーナー・店主のみとなります）" },

      // 簿記3級⑧決算の全体像
      { id: 70, stage: "⑧決算の全体像", question: "財務諸表の中心となるもので、財政状態を表す『①』と、経営成績を表す『②』は何か？", answer: "① 貸借対照表（Balance sheet = B/S）\n② 損益計算書（Profit and loss statement = P/L）" },
      { id: 71, stage: "⑧決算の全体像", question: "貸借対照表は一定時点の『①』を表し、損益計算書は一定期間の『②』を表す", answer: "① 財政状態　② 経営成績" },
      { id: 72, stage: "⑧決算の全体像", question: "決算整理前の残高試算表に, 決算整理仕訳を全て反映させた段階の試算表を何と呼ぶか？", answer: "決算整理後試算表（後T/B）" },
      { id: 73, stage: "⑧決算の全体像", question: "期末日が3月31日である場合、決算作業は4月1日以降に行うのが通常（3月中には行わない）である。〇か×か？", answer: "〇" },

      // 簿記3級⑨決算整理仕訳1/3
      { id: 74, stage: "⑨決算整理仕訳1/3", question: "決算。3月31日時点の現金手許有高は30,500円だが、帳簿残高は30,000円であった。本日になっても不一致の原因が判明しないため、適切な決算仕訳を行う", answer: "現金 500 ／ 雑益 500" },
      { id: 75, stage: "⑨決算整理仕訳1/3", question: "3月29日に電気代1万円を小切手を振り出して支払っていた（仕訳済）。期末に当座預金残高が1,000円（借方）になっているが、当座借越契約が結ばれている。適切な決算整理仕訳は？", answer: "当座預金 9,000 ／ 当座借越 9,000", hint: "もし問題で当座借越勘定が指定されていない場合は「借入金」等を用います。" },
      { id: 76, stage: "⑨決算整理仕訳1/3", question: "決算において、期末手許に未使用の郵便切手80円×100枚、収入印紙200円×100枚が残っていることが判明した。振替仕訳を行え", answer: "貯蔵品 28,000 ／ 通信費 8,000・租税公課 20,000", hint: "いつ購入したかは関係ありません。残高を決算時に「貯蔵品（資産）」に一時退避させます。" },
      { id: 77, stage: "⑨決算整理仕訳1/3", question: "2月1日に3ヶ月分(2月〜4月)の家賃（1ヶ月あたり10万円）を当座預金で一括で支払っていた。決算整理仕訳（テナント・店主側）を行え", answer: "前払家賃 100,000 ／ 支払家賃 100,000", hint: "決算日(3/31)時点で、まだ来ていない4月分(1ヶ月分)が「前払い（資産）」になります。" },
      { id: 78, stage: "⑨決算整理仕訳1/3", question: "2月1日に3ヶ月分(2月〜4月)の家賃（1ヶ月10万円）を当座預金に受け取っていた。決算整理仕訳（大家側）を行え", answer: "受取家賃 100,000 ／ 前受家賃 100,000", hint: "決算日(3/31)時点で、来期の4月分(1ヶ月分)が「前受け（負債）」になります。" },
      { id: 79, stage: "⑨決算整理仕訳1/3", question: "家賃（月額10万円）は常に翌月払いの契約である。決算整理仕訳（テナント側）を行え", answer: "支払家賃 100,000 ／ 未払家賃 100,000", hint: "3月分は翌月（4月）に払うため、決算日時点では「未払い（負債）」の計上をします。" },
      { id: 80, stage: "⑨決算整理仕訳1/3", question: "家賃（月額10万円）は常に翌月回収の契約である。決算整理仕訳（大家側）を行え", answer: "未収家賃 100,000 ／ 受取家賃 100,000", hint: "3月分は来月入金となるため、決算日時点では「未収（資産）」を計上します。" },
      { id: 81, stage: "⑨決算整理仕訳1/3", question: "×1年1月1日、A社がB社に100万円を貸し付けた（年利1.2%、利息は満期一括回収）。当期末は×1年3月31日。決算整理仕訳（A社側）を行え", answer: "未収利息 3,000 ／ 受取利息 3,000", hint: "1年分の利息は 12,000円。当期分に属する3ヶ月分（1月〜3月）の 3,000円を未収処理します。" },
      { id: 82, stage: "⑨決算整理仕訳1/3", parentId: 81, question: "前問(Q81)の貸付における、借主であるB社側の当期末決算整理仕訳を答えよ", answer: "支払利息 3,000 ／ 未払利息 3,000" },
      { id: 83, stage: "⑨決算整理仕訳1/3", question: "電気代は常に翌月払いである。1月:3万円、2月:2万円、3月:4万円だった。決算日3/31における決算整理仕訳を行え", answer: "水道光熱費 40,000 ／ 未払費用 40,000" },
      { id: 84, stage: "⑨決算整理仕訳1/3", question: "×1年1月1日に、3年分の保険料36万円を現金で支払った（支払時に「支払保険料」で処理済）。当期末は×1年3月31日。決算整理仕訳を行え", answer: "前払保険料 330,000 ／ 支払保険料 330,000" },

      // 簿記3級⑩決算整理仕訳2/3
      { id: 85, stage: "⑩決算整理仕訳2/3", question: "×2年3月31日決算. ×1年4月1日に購入した機械装置（取得価額100万円・耐用年数9年・残存価額10万円）について、定額法・間接法で当期の減価償却を行え", answer: "減価償却費 100,000 ／ 機械装置減価償却累計額 100,000", hint: "(100万円 − 10万円) ÷ 9年 ＝ 100,000円" },
      { id: 86, stage: "⑩決算整理仕訳2/3", parentId: 85, question: "前問の機械装置について、翌年×3年3月31日の決算日における当期の減価償却仕訳を答えよ", answer: "減価償却費 100,000 ／ 機械装置減価償却累計額 100,000" },
      { id: 87, stage: "⑩決算整理仕訳2/3", parentId: 85, question: "×3年4月1日（期首）、上記で減価償却を行っていた機械装置（取得価額100万円、累計額20万円）を50万円で売却し、代金は後日回収とした", answer: "機械装置減価償却累計額 200,000・未収入金 500,000・固定資産売却損 300,000 ／ 機械装置 1,000,000", hint: "売却時の機械の価値(帳簿価額)は80万円。それを50万円で売却したため30万円の売却損が出ます。" },
      { id: 88, stage: "⑩決算整理仕訳2/3", question: "①×2年3月1日にB社へ商品100円を掛け販売した。\n②×2年3月3日にB社が倒産し、売掛金が回収不能となった。それぞれの仕訳は？", answer: "① 売掛金 100 ／ 売上 100\n② 貸倒損失 100 ／ 売掛金 100" },
      { id: 89, stage: "⑩決算整理仕訳2/3", question: "初めての決算。売掛金と受取手形の合計が100,000円。これに対し2%の貸倒れを見積もる。なお差額補充法による仕訳を行え", answer: "貸倒引当金繰入 2,000 ／ 貸倒引当金 2,000", hint: "初年度（残高0）のため、見積額の全額を繰り入れます。" },
      { id: 90, stage: "⑩決算整理仕訳2/3", question: "①×2年3月1日に販売し売掛金100円とした。\n②×2年4月3日に得意先が倒産し、回収不能となった. 決算整理は3/31をまたいでおり、引当金残高は1,000円ある。仕訳を行え", answer: "① 売掛金 100 ／ 売上 100\n② 貸倒引当金 100 ／ 売掛金 100", hint: "決算期をまたいだ回収不能（前期以前の売上債権）は「貸倒引当金」を取り崩して充当します。" },
      { id: 91, stage: "⑩決算整理仕訳2/3", question: "×4年5月1日、C社が倒産。売掛金300円が回収不能となった。このうち100円は前期売上分、200円は当期売上分。貸倒引当金残高は1,000円ある。仕訳を行え", answer: "貸倒引当金 100・貸倒損失 200 ／ 売掛金 300", hint: "前期に発生した債権は「引当金」を充て、当期に発生した債権はそのまま「貸倒損失（費用）」とします。" },
      { id: 92, stage: "⑩決算整理仕訳2/3", question: "×8年3月31日決算。売掛金と受取手形の期末残高合計は100,000円。2%の貸倒れを見積もる。なお貸倒引当金残高は3,000円ある。適切な整理仕訳（差額補充法）を行え", answer: "貸倒引当金 1,000 ／ 貸倒引当金戻入 1,000", hint: "必要な額は 2,000円ですが現在 3,000円あるため、余った 1,000円を「戻入（収益）」として減らします。" },
      { id: 93, stage: "⑩決算整理仕訳2/3", question: "①×2年3月20日掛け販売(300円)\n②×2年3月25日倒産し貸倒処理\n③×2年3月30日(期末前)にその一部100円を現金で回収。それぞれの仕訳は？", answer: "① 売掛金 300 ／ 売上 300\n② 貸倒損失 300 ／ 売掛金 300\n③ 現金 100 ／ 貸倒損失 100" },
      { id: 94, stage: "⑩決算整理仕訳2/3", question: "①×2年3月20日掛け販売(300円)\n②×2年3月25日倒産し貸倒処理（決算日は3/31、引当金500円あり）\n③翌期×2年4月1日にその一部100円を現金で回収（引当金残高500）。それぞれの仕訳は？", answer: "① 売掛金 300 ／ 売上 300\n② 貸倒損失 300 ／ 売掛金 300\n③ 現金 100 ／ 償却債権取立益 100", hint: "前期に一度貸倒れとして確定した取引の逆仕訳はできないため、翌期以降の回収は「償却債権取立益（収益）」で処理します。" },
      { id: 95, stage: "⑩決算整理仕訳2/3", question: "×2年3月1日に120万円の事務用パソコンを購入した。×2年3月31日, 定額法（耐用年数10年、残存価額0円、間接法）で1ヶ月分の減価償却を行え", answer: "減価償却費 10,000 ／ 備品減価償却累計額 10,000", hint: "年額 12万円ですが、使用期間が1ヶ月のため、月割計算して 1万円を償却します。" },
      { id: 96, stage: "⑩決算整理仕訳2/3", parentId: 95, question: "前問の続き。×2年5月31日に当該パソコンを100万円で売却し、代金は後日回収とした。当期首は4月1日。期中売却の仕訳を行え", answer: "備品減価償却累計額 10,000・減価償却費 20,000・未収入金 1,000,000・固定資産売却損 170,000 ／ 備品 1,200,000", hint: "売却日までに当期使用した2ヶ月分（4月、5月分）の追加の減価償却（2万円）を同時に計上します。" },

      // 簿記3級⑪決算整理仕訳3/3
      { id: 97, stage: "⑪決算整理仕訳3/3", question: "三分法で決算の際に「仕入／繰越商品（しーくり）」「繰越商品／仕入（くりしー）」を行うのはなぜか、理由を答えよ", answer: "売上原価を「仕入」勘存の残高として算定するため。", hint: "三分法は普段は売上原価が分かりません。そのため、期首の在庫を仕入にプラスし、期末の在庫を仕入から引くことで、仕入勘定を売上原価の金額へと調整します（分記法では都度売買益を出すので不要です）。" },
      { id: 98, stage: "⑪決算整理仕訳3/3", question: "決算。期首の繰越商品（在庫）は200万円、期末の繰越商品（在庫）は300万円である。三分法の決算整理仕訳を答えよ", answer: "仕入 2,000,000 ／ 繰越商品 2,000,000\n繰越商品 3,000,000 ／ 仕入 3,000,000" },
      { id: 99, stage: "⑪決算整理仕訳3/3", question: "以下の決算残高から、当期の繰越利益剰余金の変動金額はいくらになるか算出せよ。\n・売上 490円、受取家賃 10円\n・仕入 200円、給料 30円、水道光熱費 10円\n・期首棚卸 50円、期末棚卸 30円", answer: "240円（増加）", hint: "【仕訳の流れ】\n①しーくり：仕入 50／繰商品 50\n②くりしー：繰商品 30／仕入 30 (これにより仕入=売上原価は220に確定)\n③損益振替(収益)：売上 490・受取家賃 10／損益 500\n④損益振替(費用)：損益 260／仕入 220・給料 30・水道光熱費 10\n⑤剰余金振替：損益 240／繰越利益剰余金 240" },

      // 簿記3級⑫税金
      { id: 100, stage: "⑫税金", question: "税抜100円の商品を現金で仕入れた（税抜経理方式・消費税率10%とする）", answer: "仕入 100・仮払消費税 10 ／ 現金 110", hint: "税抜経理なので、本体は「仕入」、消費税分は「仮払消費税」という資産科目になります。" },
      { id: 101, stage: "⑫税金", question: "税抜売価200万円（仕入額50万円）の商品を掛け販売した（税抜経理方式・消費税率10%とする）", answer: "売掛金 2,200,000 ／ 売上 2,000,000・仮受消費税 200,000", hint: "三分法なので、売る時は仕入値50万円は関係ありません。" },
      { id: 102, stage: "⑫税金", question: "決算。仮払消費税の残高が500万円、仮受消費税の残高が600万円であった。納付額を確定させる決算仕訳を行え", answer: "仮受消費税 6,000,000 ／ 仮払消費税 5,000,000・未払消費税 1,000,000", hint: "仮受（客から預かった） ＞ 仮払（仕入時に払った）の差額は, 国へ支払う義務があるため「未払消費税（負債）」になります。" },
      { id: 103, stage: "⑫税金", question: "決算において、税引前当期純利益が100万円、実効税率が40%である。法人税等の計上仕訳を行え", answer: "法人税等 400,000 ／ 未払法人税等 400,000", hint: "法人税等の計算により、最終的に繰越利益剰余金へ振り替わる金額は60万円（利益100万 − 税金40万）となります。" },
      { id: 104, stage: "⑫税金", parentId: 103, question: "確定申告を行い, 上記の未払法人税等40万円を小切手を振り出して納付した", answer: "未払法人税等 400,000 ／ 当座預金 400,000" },
      { id: 105, stage: "⑫税金", question: "期中に、法人税等の中間納付として20万円を小切手を振り出して支払った", answer: "仮払法人税等 200,000 ／ 当座預金 200,000" },
      { id: 106, stage: "⑫税金", question: "翌期の決算。税引前当期純利益は200万円。実効税率40%。期中に中間納付20万円を支払っている。決算整理仕訳を行え", answer: "法人税等 800,000 ／ 仮払法人税等 200,000・未払法人税等 600,000" },

    function setStorageItem(key, value) {
      if (isLocalStorageAvailable) {
        try {
          localStorage.setItem(key, value);

        } catch (e) {
          console.warn("localStorage set failed", e);
        }
      }
      memoryStorage[key] = value;
    }

    // --- 4. Web Audio API によるシンセ効果音 ---
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.error("Audio init error", e);
      }
    }

    function playTone(freq, type, duration, delay = 0, volume = 0.08) {
      try {
        initAudio();
        if (!audioCtx) return;
        
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          
          osc.type = type; 
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          
          gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
          
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        }, delay * 1000);
      } catch (e) {
        console.error("Audio error", e);
      }
    }

        return `やれよ。おい。今すぐこの仕訳のロジックを脳に刷り込みなさい！\n${baseLogic}\nこれくらい1秒で仕訳できなきゃ、簿記3級なんて夢のまた夢よ！次も気合い入れてやりなさい！`;
      } else if (charStyle === 'jk') {
        return `お疲れ様です！この仕訳のロジック、すっごくきれいですよね。\n${baseLogic}\n一歩ずつ合格に向けて進んでいる感じがして、とてもいい流れです。次もがんばりましょう！`;
      } else if (charStyle === 'maid') {
        return `あなた、本日の仕訳の要点を丁寧にご説明いたします。\n${baseLogic}\nここを押さえれば、この仕訳はかなり理解しやすくなります。いつでも落ち着いて進めていきましょう。`;
      } else if (charStyle === 'minimal') {
        return `要点：${baseLogic.replace("配置します。", "").replace("記帳します。", "")}。左右の増減ルールを記憶してください。`;
      } else {
        return `【カスタムAI先生】\n仕訳：${answer}\n論理：${baseLogic}\nあなたの設定した個性で応援しています！`;
      }
    }

    async function callGeminiAPI(systemPrompt, userQuery) {
      const apiKeyValue = getApiKey();
      if (!apiKeyValue) {
        // キー未入力時は1秒のローディング演出を入れてモックを返す (Previewでの動作を完全保障！)
        await new Promise(resolve => setTimeout(resolve, 800));
        const currentStyle = getStorageItem('sakura_boki_ai_style') || 'default';
        return generateMockResponse(state.currentSessionQueue[state.currentIndexInSession].question, state.currentSessionQueue[state.currentIndexInSession].answer, currentStyle);
      }

      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent";
      
      const payload = {
        contents: [
          {
            parts: [{ text: userQuery }]
          }
        ],
        system_instruction: {
          parts: [{ text: systemPrompt }]
        },
        generationConfig: {
          temperature: 0.7,
          responseMimeType: "text/plain"
        }
      };

      let delay = 1000;
      for (let i = 0; i < 3; i++) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKeyValue
            },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`API Error: ${response.status} ${errorText}`);
          }
          const data = await response.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return text;
          throw new Error("No text returned in response.");
        } catch (error) {
          if (i === 2) {
            throw error; 
          }
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2; 
        }
      }
    }

      const userQuery = `問題：${q.question}\n答え（仕訳）：${q.answer}\nヒント：${q.hint || "なし"}\n\nこの仕訳について、なぜその勘定科目になるのか、借方と貸方の配置の理由を含めてキャラクターになりきって優しく教えて。`;

      try {

    }

    // AI質問チャット送信関数
    async function sendChatMessage(q, inputId) {
      initAudio();
      sounds.tap();
      const inputEl = document.getElementById(inputId);
      if (!inputEl) return;
      const userMsg = inputEl.value.trim();
      if (!userMsg) return;

      state.chatHistory.push({ role: 'user', text: userMsg });
      state.chatLoading = true;
      render();
      scrollChatToBottom();

      const systemPrompt = getAISystemPrompt() + "\n学習者から質問を受けました。設定されたキャラクターと口調を完全に崩さずに、最高にわかりやすく答えてください。";
      
      let conversationContext = `問題：${q.question}\n答え（仕訳）：${q.answer}\n\n`;
      state.chatHistory.forEach(h => {
        conversationContext += `${h.role === 'user' ? '生徒' : '講師'}: ${h.text}\n`;
      });
      conversationContext += "\nこれに対する最適な回答を学習者に向けて作成してください。";

      try {
        const reply = await callGeminiAPI(systemPrompt, conversationContext);
        state.chatHistory.push({ role: 'model', text: reply });
      } catch (e) {
        state.chatHistory.push({ role: 'model', text: "エラー：回答を生成できませんでした。もう一度送信してください。" });
      } finally {
        state.chatLoading = false;
        render();
        scrollChatToBottom();
      }
    }

    // --- 7. アプリケーション制御ロジック ---

    function getStageStats(stageName) {
      const stageQuestions = state.questions.filter(q => q.stage === stageName);
      const total = stageQuestions.length;
      const cleared = stageQuestions.filter(q => q.isCleared).length;
      return { total, cleared, remaining: total - cleared };
    }

    function getFavoriteStats() {
      const favQuestions = state.questions.filter(q => q.isFavorite);
      const total = favQuestions.length;
      const cleared = favQuestions.filter(q => q.isCleared).length;
      return { total, cleared, remaining: total - cleared };
    }

    function startSession(stageName, isNextRound = false) {
      initAudio();

      state.activeStage = stageName;
      state.roundCount = getStageRound(stageName);
      let targetQuestions = [];
      
      if (stageName === 'favorite') {
        targetQuestions = state.questions.filter(q => q.isFavorite);
        if (targetQuestions.length === 0) {
          showModal("お気に入り", "お気に入り登録された問題がありません。\n画面下部の一覧から☆マークを押して登録してね！🌸");
          return;
        }
      } else {
        targetQuestions = state.questions.filter(q => q.stage === stageName);
      }
      
      let uncleared = targetQuestions.filter(q => !q.isCleared);
      
      if (uncleared.length === 0) {
        state.roundCount = advanceStageRound(stageName);
        targetQuestions.forEach(q => q.isCleared = false);
        saveProgress();
        uncleared = [...targetQuestions];
      }
      
      state.currentSessionQueue = shuffle(uncleared);
      state.currentIndexInSession = 0;
      state.totalInSession = state.currentSessionQueue.length;
      state.sessionCorrectCount = 0;
      state.sessionWrongCount = 0;
      state.showAnswer = false;
      state.showHint = false;
      // Gemini用一時ステートをリセット
      state.aiExplanation = "";
      state.aiLoading = false;
      state.chatHistory = [];
      state.chatLoading = false;
      state.view = 'play';
      
      sounds.tap();
      render();
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function toggleAnswer() {
      sounds.answer();
      state.showAnswer = true;
      render();
      setTimeout(() => {
        document.getElementById('answer-action-area')?.scrollIntoView({

        });
      }, 120);
    }

    function pressEasy() {
      sounds.easy();
      const currentQ = state.currentSessionQueue[state.currentIndexInSession];
      currentQ.isCleared = true;
      state.sessionCorrectCount++;
      
      saveProgress();
      nextQuestion();
    }

    function pressHard() {
      sounds.hard();
      const currentQ = state.currentSessionQueue[state.currentIndexInSession];
      currentQ.isCleared = false;
      currentQ.wrongCount++;
      state.sessionWrongCount++;
      
      saveProgress();
      nextQuestion();
    }

    function nextQuestion() {
      state.currentIndexInSession++;
      state.showAnswer = false;
      state.showHint = false;
      state.aiExplanation = "";
      state.aiLoading = false;
      state.chatHistory = [];
      state.chatLoading = false;
      
      if (state.currentIndexInSession >= state.totalInSession) {
        const stats = state.activeStage === 'favorite' ? getFavoriteStats() : getStageStats(state.activeStage);
        
        if (stats.remaining === 0) {
          sounds.perfectClear();
        } else {
          sounds.roundClear();
        }
        
        state.view = 'result';
      }
      render();
    }

          maid: '丁寧で落ち着いた敬語で、手順をやわらかく案内します。',
          minimal: '雑談を省き、要点だけを短く説明します。',
          custom: '自由に作った性格・口調で説明します。'
        };
        const aiStyleOptionsHtml = aiStyleOrder.map(styleKey => `
              <label class="flex items-start gap-2 cursor-pointer font-bold bg-white p-2.5 rounded-xl border border-sky-100">
                <input class="mt-1" type="radio" name="ai-style-radio" value="${styleKey}" ${currentAIStyle === styleKey ? 'checked' : ''} onclick="changeAICharacter('${styleKey}')">
                <div>
                  <span class="font-black text-slate-800">${aiStyleLabels[styleKey]}</span>
                  <p class="text-[10px] text-slate-400 mt-0.5">${aiStyleDescriptions[styleKey]}</p>
                </div>
              </label>
        `).join('');
        const aiPromptEditorsHtml = aiStyleOrder.map(styleKey => {
          const inputId = `ai-style-prompt-${styleKey}`;
          return `
              <div class="bg-white p-3 rounded-2xl border border-sky-100 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-black text-slate-700 text-[11px]">${aiStyleLabels[styleKey]}</span>
                  ${currentAIStyle === styleKey ? '<span class="bg-sky-100 text-sky-700 text-[9px] font-black px-2 py-0.5 rounded-full">選択中</span>' : ''}
                </div>
                <textarea id="${inputId}" rows="3"
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold focus:border-sky-400 outline-none leading-relaxed text-[11px]">${escapeHtml(getAIStylePrompt(styleKey))}</textarea>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="saveAIStylePrompt('${styleKey}', '${inputId}')" class="btn-bubbly py-2 bg-[#3498DB] hover:bg-[#2980B9] text-white font-black rounded-xl text-center shadow-sm text-[11px]">
                    保存
                  </button>
                  <button onclick="resetAIStylePrompt('${styleKey}')" class="btn-bubbly py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black rounded-xl text-center shadow-sm text-[11px]">
                    初期値に戻す
                  </button>
                </div>
              </div>
          `;
        }).join('');

        aiStyleHtml = `
          <div class="p-4 bg-sky-50/50 rounded-b-2xl border-t border-sky-100 space-y-4 text-xs text-left animate-fade-in">
            <p class="font-bold text-slate-600">解説を生成・チャットするAIの性格を選べます。下の欄で5パターンすべてのプロンプトを編集できます。</p>
            
            <div class="space-y-2">
              ${aiStyleOptionsHtml}
            </div>

            <div class="space-y-3">
              <div>
                <span class="font-black text-slate-700 block">5パターンのプロンプト編集</span>
                <p class="text-[10px] text-slate-500 font-bold mt-0.5">保存すると、選択中のAI解説・チャットに反映されます。</p>
              </div>
              ${aiPromptEditorsHtml}
            </div>

            <!-- APIキー設定欄 -->
            <div class="bg-[#EBF5FB] p-3 rounded-2xl border border-sky-200 space-y-2 mt-2">
              <span class="font-black text-sky-800 block">🔑 Gemini APIキー設定 (任意)</span>
              <p class="text-[9px] text-sky-950/60 leading-relaxed font-bold">※キーを入力すると、本物の最新AIがチャットや解説を担当します。未入力時はオフライン用の【体験モック解説モード】で安全に動作します！🌸</p>
              <input id="user-gemini-key-input" type="password" placeholder="AIキーをペースト..." value="${escapeHtml(userApiKey)}"
                class="w-full bg-white border border-slate-200 rounded-xl p-2 font-bold focus:border-sky-400 outline-none leading-relaxed text-[10px]">
              <button onclick="saveUserApiKey('user-gemini-key-input')" class="btn-bubbly w-full py-2 bg-[#2ECC71] text-white font-black rounded-xl text-center shadow-sm">
                APIキーを安全に保存する 💾
              </button>
            </div>
          </div>
        `;
      }

      const aiStyleAccordionHtml = `
        <div class="bg-white rounded-3xl border-2 border-sky-100 shadow-[0_4px_0_#9DC6E4] mb-4 overflow-hidden">
          <div onclick="toggleAccordion('aiStyle')" class="bg-[#D6EAF8] px-4 py-3 flex justify-between items-center cursor-pointer border-b-2 border-sky-200 select-none">
            <div>
              <h4 class="text-sm font-black text-slate-800 flex items-center gap-1.5">🧠 AIパートナー設定</h4>
              <p class="text-[10px] text-sky-950/65 font-bold mt-0.5">清楚系JK・メイド・極限ミニマルなど解説の話し方を自由変更</p>
            </div>
            <div class="text-sky-800 font-bold text-xs bg-white/80 w-6 h-6 rounded-full flex items-center justify-center shadow-sm">
              ${isAIStyleOpen ? '▲' : '▼'}
            </div>
          </div>
          ${aiStyleHtml}
        </div>
      `;

      // ⑤ 「問題文の編集・注釈の追加」アコーディオン
      const isEditorOpen = state.accordionOpened['editor'] || false;
      let editorHtml = '';
      if (isEditorOpen) {
        // 現在選ばれているステージの問題をロード
        const filteredEditorQuestions = state.questions.filter(q => q.stage === state.editorActiveStage);
        
        editorHtml = `
          <div class="p-4 bg-sky-50/50 rounded-b-2xl border-t border-sky-100 space-y-4 text-xs text-left animate-fade-in">
            <p class="font-bold text-slate-600">問題文を自由に編集・注釈を上書きできます。仕訳がより理解しやすくなります。</p>
            
            <!-- 編集ステージ選択プルダウン -->
            <div class="flex items-center gap-2">
              <span class="font-black text-slate-700 whitespace-nowrap">編集対象:</span>
              <select onchange="initAudio(); state.editorActiveStage = this.value; render();" class="flex-1 bg-white border border-sky-200 rounded-xl p-2 font-black outline-none focus:border-sky-400">
                ${stageNames.map(s => `<option value="${s}" ${state.editorActiveStage === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>

            <!-- 選択された問題の編集フォームリスト -->
            <div class="space-y-4 mt-2 max-h-[300px] overflow-y-auto pr-1">
              ${filteredEditorQuestions.map(q => `
                <div class="bg-white p-3 rounded-2xl border border-sky-100 space-y-2 shadow-sm animate-fade-in">
                  <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                    <span class="font-black text-sky-600 font-mono">Q${q.id % 100} (${q.stage})</span>
                    <button onclick="restoreQuestionDefault(${q.id})" class="text-[9px] font-bold text-rose-500 hover:text-rose-600 bg-rose-50 py-0.5 px-2 rounded-full border border-rose-100">デフォルトに戻す</button>
                  </div>
                  
                  <div>
                    <span class="text-[10px] font-black text-slate-400 block mb-1">【変更前の問題（デフォルト）】</span>
                    <p class="text-[11px] text-slate-600 leading-relaxed bg-slate-50 p-2 rounded-xl border border-slate-100 font-bold whitespace-pre-wrap">${escapeHtml(q.originalQuestion)}</p>
                  </div>

                  <div>
                    <span class="text-[10px] font-black text-sky-600 block mb-1">【変更後の問題（ここに自由に追記・編集してね）】</span>
                    <textarea id="editor-input-${q.id}" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold focus:border-sky-400 outline-none leading-relaxed text-[11px]">${escapeHtml(q.question)}</textarea>
                  </div>

                  <button onclick="updateQuestionText(${q.id}, 'editor-input-${q.id}')" class="btn-bubbly w-full py-1.5 bg-[#5EF2D3] text-emerald-950 font-black rounded-xl text-center shadow-sm text-[11px]">
                    問題文を保存する 💾
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      const editorAccordionHtml = `
        <div class="bg-white rounded-3xl border-2 border-sky-100 shadow-[0_4px_0_#9DC6E4] mb-8 overflow-hidden">
          <div onclick="toggleAccordion('editor')" class="bg-[#D6EAF8] px-4 py-3 flex justify-between items-center cursor-pointer border-b-2 border-sky-200 select-none">
            <div>
              <h4 class="text-sm font-black text-slate-800 flex items-center gap-1.5">✏️ 問題文の編集・注釈の追加</h4>
              <p class="text-[10px] text-sky-950/65 font-bold mt-0.5">全問題のテキストを自由に書き換えて、自分用の問題集に。</p>
            </div>
            <div class="text-sky-800 font-bold text-xs bg-white/80 w-6 h-6 rounded-full flex items-center justify-center shadow-sm">
              ${isEditorOpen ? '▲' : '▼'}
            </div>
          </div>
          ${editorHtml}
        </div>
      `;

      return `
        ${favoriteButtonHtml}
        ${stagesAccordionHtml}
        ${analysisAccordionHtml}
        ${aiStyleAccordionHtml}
        ${editorAccordionHtml}
      `;
    }

    // 8-2. プレイ画面 (AIチャット&AI解説 統合、1行結合による文頭空白バグ完全解決)
    function renderPlayView() {
      const q = state.currentSessionQueue[state.currentIndexInSession];
      const percent = Math.round((state.currentIndexInSession / state.totalInSession) * 100);
      
      const isFav = q.isFavorite;
      const progressLabel = `${state.currentIndexInSession + 1} / ${state.totalInSession} 問`;

      const modeBadge = state.activeStage === 'favorite' 
        ? `<span class="bg-blue-100 text-blue-700 text-xs font-black px-3 py-1 rounded-full border border-blue-200">⭐ お気に入り特訓</span>`
        : `<span class="bg-sky-100 text-sky-700 text-xs font-black px-3 py-1 rounded-full border border-sky-200">📁 ${state.activeStage}</span>`;

      let parentHtml = '';
      if (q.parentId) {
        const parentQ = state.questions.find(item => item.id === q.parentId);
        if (parentQ) {
          parentHtml = `
            <div class="bg-indigo-50 border border-indigo-100 text-indigo-950 rounded-2xl p-3 text-xs text-left mb-4 shadow-inner animate-fade-in">
              <span class="bg-indigo-100 text-indigo-800 text-[9px] font-black px-1.5 py-0.5 rounded">前提問題 Q${parentQ.id % 100}</span>
              <p class="mt-1 font-bold leading-relaxed whitespace-pre-wrap">${escapeHtml(parentQ.question)}</p>
            </div>
          `;
        }
      }

      // 答えを見た後に活性化するAI解説 & 質問エリア
      let aiSectionHtml = '';
      if (state.showAnswer) {
        aiSectionHtml = `
          <!-- AI解説 -->
          <div class="mt-4 pt-4 border-t border-sky-100 animate-fade-in">
            ${state.aiLoading ? `
              <div class="bg-sky-50 border border-sky-100 rounded-2xl p-4 text-left animate-pulse">
                <span class="text-xs font-black text-sky-800 flex items-center gap-1.5">🧠 AI解説生成中...</span>
                <p class="text-xs text-slate-400 font-bold mt-2">あなたのために、解説を考えています。もう少し待っていてください…</p>
              </div>
            ` : state.aiExplanation ? `
              <div class="bg-sky-50 border border-sky-100 rounded-2xl p-4 text-left animate-fade-in shadow-inner">
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-base">🧠</span>
                  <span class="text-xs font-black text-sky-800 tracking-wider">AI仕訳マスター解説</span>
                  ${!getApiKey() ? `<span class="bg-sky-200/50 text-sky-800 text-[8px] font-bold px-1.5 py-0.5 rounded ml-auto">体験モック動作中</span>` : ''}
                </div>
                <p class="text-xs text-slate-700 font-bold leading-relaxed whitespace-pre-wrap">${escapeHtml(state.aiExplanation)}</p>
              </div>
            ` : `
              <button onclick="generateAIExplanation(state.currentSessionQueue[state.currentIndexInSession])" 
                class="btn-bubbly w-full py-2 px-4 rounded-xl text-xs font-black text-sky-700 bg-sky-50 border border-sky-200 hover:bg-sky-100 transition-colors flex items-center justify-center gap-1">
                🧠 ✨ AI仕訳解説を生成する
              </button>
            `}
          </div>

          <!-- AIなんでも質問チャット -->
          <div class="mt-4 bg-[#EDF2F7] border border-slate-200 rounded-2xl p-4 text-left animate-fade-in shadow-inner">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-base">💬</span>
              <span class="text-xs font-black text-slate-700 tracking-wider">AIなんでも仕訳チャット</span>
            </div>
            
            <!-- チャットログ -->
            <div id="chat-log-container" class="space-y-3 max-h-[160px] overflow-y-auto mb-3 pr-1 text-[11px]">
              <div class="flex flex-col items-start">
                <span class="text-[9px] text-slate-400 font-bold mb-0.5">AI先生</span>
                <div class="p-2.5 rounded-2xl bg-white text-slate-800 rounded-tl-none border border-slate-100 shadow-sm font-bold leading-relaxed animate-fade-in">
                  解説を読んでもわからないところがあれば何でも聞いてね！何回でも分かりやすく教えるからね🌸
                </div>
              </div>

              ${state.chatHistory.map(h => `
                <div class="flex flex-col ${h.role === 'user' ? 'items-end' : 'items-start'}">
                  <span class="text-[9px] text-slate-400 font-bold mb-0.5">${h.role === 'user' ? 'あなた' : 'AI先生'}</span>
                  <div class="p-2.5 rounded-2xl max-w-[85%] leading-relaxed font-bold animate-fade-in
                    ${h.role === 'user' ? 'bg-[#3498DB] text-white rounded-tr-none' : 'bg-white text-slate-800 rounded-tl-none border border-slate-100 shadow-sm'}">
                    ${escapeHtml(h.text)}
                  </div>
                </div>
              `).join('')}
              
              ${state.chatLoading ? `
                <div class="flex flex-col items-start animate-pulse">
                  <span class="text-[9px] text-slate-400 font-bold mb-0.5">AI先生思考中...</span>
                  <div class="p-2.5 rounded-2xl bg-white text-slate-400 rounded-tl-none border border-slate-100 shadow-sm font-bold">
                    分かりやすい回答を作成中です。お待ちくださいね。
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- チャット入力 -->
            <div class="flex gap-2">
              <input id="chat-input" type="text" placeholder="AIに質問する... (例: なぜ売掛金は左側？)" 
                class="flex-1 bg-white border border-slate-200 text-xs font-bold rounded-xl px-3 py-2 outline-none focus:border-[#3498DB] transition-all"
                onkeydown="if(event.key === 'Enter') sendChatMessage(state.currentSessionQueue[state.currentIndexInSession], 'chat-input')">
              <button onclick="sendChatMessage(state.currentSessionQueue[state.currentIndexInSession], 'chat-input')" 
                class="bg-[#3498DB] hover:bg-[#2980B9] text-white text-xs font-black px-3 py-2 rounded-xl shadow-sm transition-colors">
                送信
              </button>
            </div>
          </div>
        `;
      }

      return `
        <!-- 固定戻るヘッダー -->
        <div class="flex items-center justify-between mb-3">
          <button onclick="goBackToSelect()" class="bg-white hover:bg-slate-50 text-slate-600 font-bold py-1.5 px-3.5 rounded-2xl text-[11px] border-2 border-sky-100 shadow-sm flex items-center gap-1.5 transition-colors">
            ◀ 一覧に戻る
          </button>
          
          <div class="flex items-center gap-1.5 text-xs font-black">
            <span class="text-sky-400 font-bold font-mono">周回数:</span>
            <span class="bg-[#D6EAF8] text-sky-950 px-2.5 py-0.5 rounded-full font-mono border border-sky-300 shadow-sm">${state.roundCount}周目</span>
          </div>
        </div>

        <!-- 周回進捗インジケーター -->
        <div class="bg-white rounded-3xl p-3 border-2 border-sky-100 shadow-sm mb-4 flex flex-col gap-2">
          <div class="flex justify-between items-center text-[11px] font-bold text-slate-500">
            <span class="flex items-center gap-2">
              <span class="text-sky-600">⭕ 楽勝: ${state.sessionCorrectCount}</span>
              <span class="text-orange-500">❌ ムズい: ${state.sessionWrongCount}</span>
            </span>
            <span class="font-mono text-slate-700 font-black">${progressLabel}</span>
          </div>
          
          <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-sky-400 to-sky-500 h-full rounded-full transition-all duration-300" style="width: ${percent}%"></div>
          </div>
        </div>

        <!-- メイン問題カード (h3の改行を1行に結合し、字下げバグを完全に解決) -->
        <div class="bg-white rounded-3xl p-5 border-2 border-sky-100 shadow-[0_6px_0_#9DC6E4] mb-4 relative">
          <div class="flex justify-between items-center mb-4">
            ${modeBadge}
            <button onclick="toggleFavorite(${q.id})" class="text-2xl focus:outline-none transition-transform active:scale-135 py-0.5 px-2">
              ${isFav ? '⭐' : '☆'}
            </button>
          </div>

          ${parentHtml}

          <!-- 問題テキスト (改行トリミング済、完全左揃え) -->
          <div class="text-left py-3 min-h-[85px] flex flex-col justify-center">
            <span class="text-[10px] font-black tracking-widest text-sky-400 uppercase mb-1">QUESTION</span>
            <h3 class="text-sm font-black text-slate-800 leading-relaxed whitespace-pre-wrap px-0.5">${escapeHtml(q.question)}</h3>
          </div>

          <!-- ヒント機能 -->
          ${q.hint ? `
            <div class="border-t border-dashed border-sky-100 pt-3 mt-1 text-center">
              ${state.showHint ? `
                <div class="bg-sky-50/50 border border-sky-100 rounded-2xl p-3 text-xs font-bold text-slate-600 leading-relaxed animate-fade-in text-left">
                  <span class="text-sky-500">💡 ヒント:</span> ${escapeHtml(q.hint)}
                </div>
              ` : `
                <button onclick="state.showHint = true; render();" class="text-[11px] font-bold text-sky-500 hover:text-sky-600 bg-sky-50 py-1 px-3 rounded-full transition-colors inline-flex items-center gap-1">
                  💡 ヒントを見る
                </button>
              `}
            </div>
          ` : ''}

          <!-- 答え展開エリア -->
          ${state.showAnswer ? `
            <div class="mt-4 pt-4 border-t-2 border-dashed border-sky-100 text-center animate-fade-in">
              <span class="text-[10px] font-black tracking-widest text-sky-500 uppercase block mb-2">ANSWER (仕訳)</span>
              
              <div class="bg-[#EBF5FB] text-sky-950 border-2 border-sky-200 p-3.5 rounded-2xl inline-block w-full text-left shadow-inner">
                <p class="text-sm font-black leading-relaxed whitespace-pre-wrap font-mono">${escapeHtml(q.answer)}</p>
              </div>
            </div>
          ` : ''}

          <!-- AI解説＆質問チャットセクション -->
          ${aiSectionHtml}
        </div>

        <!-- アクションボタンエリア -->
        <div class="flex flex-col gap-3">
          ${!state.showAnswer ? `
            <!-- 答えを見るボタン (記憶定着コバルトブルー) -->
            <button onclick="toggleAnswer()" class="btn-bubbly w-full bg-[#3498DB] hover:bg-[#2980B9] text-white font-black text-base py-3.5 rounded-3xl border-b-6 border-[#2471A3] shadow-md tracking-wider">
              答えを見る 👀
            </button>
          ` : `
            <!-- 2. 答え確認後の二択ボタン -->
            <div class="grid grid-cols-2 gap-3">
              <button onclick="pressHard()" class="btn-bubbly bg-[#FFD1A9] text-amber-950 font-black text-xs py-3 rounded-3xl border-b-6 border-amber-400 shadow-md flex flex-col items-center justify-center gap-1">
                <span class="text-lg">😵‍💫</span>
                <span>ムズすぎワロタ</span>
              </button>
              
              <button onclick="pressEasy()" class="btn-bubbly bg-[#5EF2D3] text-emerald-950 font-black text-xs py-3 rounded-3xl border-b-6 border-emerald-400 shadow-md flex flex-col items-center justify-center gap-1">
                <span class="text-lg">😎</span>
                <span>楽勝！</span>
              </button>
            </div>
          `}
        </div>
      `;
    }

    // 8-3. リザルト画面
    function renderResultView() {
      const stats = state.activeStage === 'favorite' ? getFavoriteStats() : getStageStats(state.activeStage);
      const isPerfect = stats.remaining === 0;

      return `
        <div class="text-center mb-6">
          <div class="inline-block bg-[#D6EAF8] text-sky-950 text-xs font-black px-4 py-1.5 rounded-full border border-sky-300 shadow-sm uppercase tracking-widest mb-2 font-mono">
            Round ${state.roundCount} Finished
          </div>
          <h2 class="text-3xl font-black text-slate-800 tracking-tight">
            ${state.roundCount}周目 終了！
          </h2>
        </div>

        <div class="bg-white rounded-3xl p-6 border-2 border-sky-100 shadow-[0_8px_0_#9DC6E4] mb-6 text-center animate-fade-in">
          <span class="text-[10px] font-black tracking-widest text-slate-400 uppercase">今回のラウンド成果</span>
          
          <div class="grid grid-cols-2 gap-4 my-5">
            <div class="bg-[#EBF5FB] border border-sky-100 p-4 rounded-2xl shadow-inner animate-fade-in">
              <div class="text-2xl mb-1">😎</div>
              <div class="text-xs text-sky-500 font-bold">楽勝認定</div>
              <div class="text-2xl font-black text-sky-600 font-mono mt-0.5">${state.sessionCorrectCount}問</div>
            </div>
            
            <div class="bg-orange-50 border border-orange-100 p-4 rounded-2xl shadow-inner animate-fade-in">
              <div class="text-2xl mb-1">😵‍💫</div>
              <div class="text-xs text-slate-500 font-bold">繰り越し</div>
              <div class="text-2xl font-black text-orange-500 font-mono mt-0.5">${state.sessionWrongCount}問</div>
            </div>
          </div>

          <div class="border-t border-sky-100 pt-5 mt-2 animate-fade-in">
            <p class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2">ステージ未クリア残数</p>
            
            ${isPerfect ? `
              <div class="inline-block bg-sky-100 text-sky-800 border border-sky-200 rounded-2xl px-6 py-4 mt-1">
                <span class="text-4xl block mb-2">🎉🌸🏆</span>
                <p class="text-base font-black">ステージ完全クリア！！！</p>
                <p class="text-xs font-bold text-sky-700/80 mt-1 leading-relaxed">
                  素晴らしいです！<br>このステージを完全にマスターしました！
                </p>
              </div>
            ` : `
              <div class="flex flex-col items-center justify-center animate-fade-in">
                <span class="text-sm font-bold text-slate-500 flex items-center gap-1.5">
                  未だ「楽勝」になっていない問題:
                  <strong class="text-xl font-black text-slate-800 font-mono bg-sky-50 px-3 py-1 rounded-xl border border-sky-200">${stats.remaining}問</strong>
                </span>
                <p class="text-xs font-bold text-sky-400 mt-2 leading-relaxed">
                  ※クリアされなかった「ムズすぎ」問題だけが、同じ周目の残り問題として引き継がれます。
                </p>
              </div>
            `}
          </div>
        </div>

        <div id="answer-action-area" class="flex flex-col gap-3 scroll-mt-6">
          ${!isPerfect ? `
            <button onclick="startSession('${state.activeStage}', true);" 
              class="btn-bubbly w-full bg-[#5EF2D3] text-emerald-950 font-black text-lg py-4.5 rounded-3xl border-b-6 border-emerald-400 shadow-md tracking-wider">
              残り ${stats.remaining}問を続ける 🚀
            </button>
            
            <button onclick="goBackToSelect()" class="btn-bubbly w-full bg-slate-50 hover:bg-slate-100 text-slate-600 font-black py-4.5 rounded-3xl border border-slate-300 shadow-sm text-center">
              ステージ選択へ戻る 🏠
            </button>
          ` : `
            <button onclick="goBackToSelect()" class="btn-bubbly w-full bg-[#FFF176] text-amber-950 font-black text-lg py-4.5 rounded-3xl border-b-6 border-amber-400 shadow-md tracking-wider text-center">
              ステージ選択へ戻る 🏠
            </button>
          `}
        </div>
      `;
    }

    // --- 8. ユーティリティ & XSS 対策 ---
    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // --- 9. 初期起動処理 ---
    window.onload = function() {
      loadProgress();
      render();
    };

  </script>
</body>
</html>
